# Nginx que serve o SPA e faz proxy da API.
#
# Dois blocos: o HTTP existe so para redirecionar ao HTTPS, e o HTTPS e o
# que atende de verdade. O objetivo do TLS aqui e nao trafegar usuario e
# senha em claro na rede interna — nao e provar identidade ao mundo.
# Certificado autoassinado cumpre isso integralmente.
#
# Este arquivo e um TEMPLATE: a imagem do nginx roda envsubst nele na
# subida, substituindo apenas variaveis de ambiente definidas. As
# variaveis do proprio nginx ($host, $uri, $http_upgrade) passam intactas.
#
# O ponto que costuma passar batido: o WebSocket do InTerminal e o dos
# logs ao vivo precisam de `Upgrade`/`Connection` explicitos e de timeout
# longo. Sem isso o terminal conecta, funciona por 60 segundos e morre
# sem mensagem.

# ── Redirecionamento ─────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Health check por HTTP continua respondendo: deploy.sh e atualizar.sh
    # o consultam de dentro da propria maquina, e redirecionar um `curl`
    # sem `-L` faria a verificacao falhar sem motivo.
    location = /api/saude {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host:${PORTA_HTTPS}$request_uri;
    }
}

# ── Aplicacao ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/faceops.crt;
    ssl_certificate_key /etc/nginx/tls/faceops.key;

    # So TLS 1.2 e 1.3. Versoes anteriores tem falha conhecida e nao ha
    # cliente antigo aqui — o painel e acessado por navegador atual.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cabecalhos de seguranca.
    #
    # `script-src 'self'` SEM unsafe-inline: o build usa
    # INLINE_RUNTIME_CHUNK=false justamente para nao precisar dele. E o
    # que transforma um XSS de "roubo de token" em "nao executa".
    #
    # `style-src` mantem unsafe-inline porque a tela usa atributo style em
    # varios lugares. Estilo inline nao executa codigo — o risco e outro,
    # e menor.
    #
    # `connect-src` inclui ws:/wss: por causa do InTerminal e dos logs ao
    # vivo; sem isso a CSP bloqueia o WebSocket em silencio.
    #
    # NAO ha HSTS aqui, de proposito: com certificado autoassinado, HSTS
    # prenderia o navegador a uma configuracao que ninguem desfaz sem
    # limpar dado do navegador. Se um dia entrar certificado de CA
    # publica, ai sim vale acrescentar.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Numa linha só, de propósito: o nginx NÃO trata barra invertida no
    # fim da linha como continuação dentro de string. Escrito em várias
    # linhas, o cabeçalho sairia com barras literais e a política seria
    # ignorada pelo navegador — uma proteção que parece existir e não
    # existe é pior que nenhuma.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'" always;

    # ── WebSocket do InTerminal ──────────────────────────────────────
    location = /api/terminal/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sessao de terminal fica minutos sem trafego enquanto o operador
        # le a tela. 1h e o teto; o backend derruba por inatividade em 30min.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── WebSocket do log ao vivo ─────────────────────────────────────
    location = /api/logs/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backup completo pode responder devagar; download de artefato de
        # dezenas de GB precisa de folego e nao pode ser bufferizado.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Estaticos ────────────────────────────────────────────────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback do SPA — qualquer rota desconhecida devolve o index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
