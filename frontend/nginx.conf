# Nginx que serve o SPA e faz proxy da API.
#
# O ponto que costuma passar batido: o WebSocket do InTerminal precisa de
# `Upgrade`/`Connection` explícitos e de timeout longo. Sem isso o terminal
# conecta, funciona por 60 segundos e morre sem mensagem.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. `connect-src` inclui ws:/wss: por causa do
    # InTerminal; sem isso a CSP bloqueia o WebSocket.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data:; \
         font-src 'self' data:; \
         connect-src 'self' ws: wss:; \
         frame-ancestors 'self'" always;

    # ── WebSocket do InTerminal ──────────────────────────────────────
    # Bloco próprio e ANTES de /api/ — a diretiva `location` mais
    # específica ganha, mas deixar explícito evita surpresa em edição.
    location = /api/terminal/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sessão de terminal fica minutos sem tráfego enquanto o operador
        # lê a tela. 1h é o teto; o backend derruba por inatividade em 30min.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── WebSocket do log ao vivo ─────────────────────────────────────
    location = /api/logs/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backup completo pode responder devagar; download de artefato de
        # dezenas de GB precisa de fôlego e não pode ser bufferizado.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Estáticos ────────────────────────────────────────────────────
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback do SPA — qualquer rota desconhecida devolve o index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
