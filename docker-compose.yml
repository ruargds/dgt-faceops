# DGT FaceOps — painel de operação do FindFace Multi
#
# Roda numa VM Linux hospedada no Windows Server (Hyper-V), FORA do
# ambiente facial. Requisito de rede: esta VM precisa alcançar as VMs do
# FindFace no Azure na porta 22.
#
# Subir:  bash deploy.sh --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: faceops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # O banco do painel guarda cadastro, histórico e auditoria — volume
    # pequeno. 512 MB sobra e deixa RAM para o resto da VM.
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: faceops_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      TZ: ${TZ:-America/Sao_Paulo}
      # Revisão do git, gravada pelo atualizar.sh — aparece em /api/saude
      # e na tela, para saber qual versão está no ar sem adivinhar.
      FACEOPS_REVISAO: ${FACEOPS_REVISAO:-desconhecida}
    volumes:
      # Artefatos de backup e gravações de terminal.
      #
      # O caminho vem do .env em vez de ser editado aqui: editar arquivo
      # versionado sujaria a árvore de trabalho e faria o `git pull` do
      # atualizar.sh falhar com "alteração local não commitada".
      - ${DIR_BACKUPS:-./data/backups}:/data/backups
      - ${DIR_SESSOES:-./data/sessions}:/data/sessions
      # Logotipos enviados pela tela de Configurações
      - ${DIR_MARCA:-./data/marca}:/data/marca
      # rclone.conf para o destino Google Drive (opcional).
      # Gere com `rclone config` e copie para ./rclone/rclone.conf
      - ./rclone:/root/.config/rclone:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/saude', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 1g
    memswap_limit: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Carimbado pelo deploy.sh / atualizar.sh com a revisao do git.
        # Sem eles (build manual), fica "desenvolvimento".
        BUILD_STAMP: ${BUILD_STAMP:-desenvolvimento}
    container_name: faceops_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Somente HTTPS. Nenhuma porta HTTP e exposta — usuario e senha
      # nunca trafegam em claro, e nao ha porta 80 para esquecer aberta.
      - "${PORTA_HTTPS:-30333}:443"
    volumes:
      # Certificado autoassinado, gerado pelo instalador. Somente leitura:
      # o container não tem motivo para escrever aqui.
      - ./tls:/etc/nginx/tls:ro
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  postgres_data:
